name: Build & Release

# Push a version tag (e.g. v1.0.0) to build SecureVault.exe on Windows
# and publish it on the repository's Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build EXE
        run: pyinstaller --noconfirm --clean SecureVault.spec
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SecureVault.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SecureVault.exe" | Out-File -Encoding ascii dist/SecureVault.exe.sha256
          Get-Content dist/SecureVault.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SecureVault-windows
          path: |
            dist/SecureVault.exe
            dist/SecureVault.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SecureVault.exe
            dist/SecureVault.exe.sha256
          generate_release_notes: true
          body: |
            **SecureVault ${{ github.ref_name }}** — offline password manager for Windows 10/11.
            Developed by Shamiul Islam.

            1. Download `SecureVault.exe` below and run it (no installation or Python needed).
            2. Windows SmartScreen may warn because the EXE is not code-signed: choose **More info → Run anyway**.
            3. Optional: verify the download with the SHA-256 checksum in `SecureVault.exe.sha256`.

            Your vault is stored locally in `%LOCALAPPDATA%\SecureVault\`. Nothing is sent over the network.
            Not independently security-audited — keep encrypted backups.
